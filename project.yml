name: MeloPlayer
options:
  bundleIdPrefix: com.meloplayer
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  MeloPlayer:
    type: application
    platform: iOS
    sources:
      - path: MeloPlayer
    info:
      path: MeloPlayer/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meloplayer.app
        PRODUCT_NAME: MeloPlayer
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets: []
