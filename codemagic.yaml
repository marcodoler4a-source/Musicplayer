workflows:
  meloplayer-ios:
    name: MeloPlayer iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "MeloPlayer.xcodeproj"
        XCODE_SCHEME: "MeloPlayer"
    scripts:
      - name: Show Xcode version
        script: xcodebuild -version
      - name: Build MeloPlayer for iOS Simulator
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.app
